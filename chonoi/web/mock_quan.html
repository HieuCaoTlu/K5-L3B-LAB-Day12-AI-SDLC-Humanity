<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Chợ Nổi — giao diện mẫu (buổi tối)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a22; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * GIAO DIỆN MẪU (mock) cho chế độ QUÁN — chưa nối với máy chủ, chưa dùng asset ảnh.
 * Mở thẳng file này bằng trình duyệt (không cần chạy chonoi.live).
 * Mọi hình pixel art ở đây được vẽ bằng code lên canvas 288x214 điểm ảnh gốc rồi phóng nguyên số nguyên
 * (nearest-neighbor). Khi có PNG thật, thay từng hàm sprite*() bằng drawImage cùng tọa độ/kích thước.
 * Mô phỏng ở đây CHỈ để xem giao diện (không phải luật chính thức); số liệu lấy theo game.contract.json.
 *
 * Phím: WASD/mũi tên = đi · E = tương tác (bếp/bàn) · 1/2/3 = ép nét mặt khách (chờ/giận/vui) · khách: chó nâu, chó xám, Chiikawa, Hachiware, Usagi · R = đặt lại
 */
const W = 288, H = 214;                 // kích thước gốc
const U = 16;                           // 1 đơn vị game = 16 px gốc
const BX = 16, BY = 28;                 // góc trên-trái của xuồng trong khung
const BW = 16 * U, BH = 10 * U;         // 256 x 160
const lo = document.createElement("canvas"); lo.width = W; lo.height = H;
const g = lo.getContext("2d");
const cv = document.getElementById("c"), ctx = cv.getContext("2d");

// ---------- số liệu (theo game.contract.json, mục quan) ----------
// (mẫu giao diện: thêm nhiều bàn để xem đủ các loại khách; số bàn thật lấy theo contract)
const C = { stove: [2, 8], tables: [[5, 2], [9, 2], [13, 2], [8, 6], [13, 6]], start: [8, 5], speed: 4, radius: 1.5, patience: 60, eat: 10, cook: 6, price: 60, rep0: 3 };
const sx = (x) => Math.round(BX + x * U), sy = (z) => Math.round(BY + (10 - z) * U);

// ---------- bảng màu (ấm, tươi, ban đêm) ----------
const P = {
  night: "#0d2a38", water1: "#14485a", water2: "#1c6676", foam: "#5fc4c4",
  wood1: "#a8703c", wood2: "#8d5a2e", wood3: "#6e4422", rim: "#4a2b14", rim2: "#2e1a0c",
  glow: "#ffd36b", red: "#d6402f", redD: "#8f2a1f", ink: "#241410",
  skin: "#e8b07a", skinD: "#c98a55", hat: "#e8cf8a", hatD: "#bf9f55",
  shirt: "#2f7f78", apron: "#efe6d0", stain: "#b9854c",
  fur: "#d9a466", furD: "#a9743c", ear: "#6e4422",
  fire: "#ff8a1f", fireY: "#ffd23f", green: "#7bd66b", steam: "#e9f2f0", metal: "#5a5f66", metalD: "#34383e",
};
function R(c, x, y, w, h) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function px(c, x, y) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }

// ---------- trạng thái mô phỏng mẫu ----------
let S;
function reset() {
  S = {
    t: 0, left: 180 * 60, money: 0, rep: C.rep0, score: 0, served: 0,
    p: { x: C.start[0], z: C.start[1], face: "d", moving: false },
    hand: null,
    stock: { ca_loc: 3, ca_linh: 4, bong_dien_dien: 2, bong_sung: 5 },
    stove: { state: "idle", left: 0 },
    // mỗi bàn một khách khác loại ngay từ đầu để xem; kindNext = loại của khách kế tiếp
    tables: C.tables.map((_, i) => ({ cust: { state: "waiting", pat: (C.patience - i * 6) * 60, left: 0, kind: i }, next: 0 })),
    kindNext: C.tables.length, force: null, toast: [],
  };
}
reset();
if (location.hash === "#demo") { S.stove = { state: "cooking", left: 200 }; S.p = { x: 5, z: 5, face: "r", moving: false }; S.hand = null; S.toast.push({ msg: "+60k (+12k boa)", ttl: 99999 }); }
const keys = new Set();
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (e.repeat) return;
  keys.add(k);
  if (k === "e") interact();
  if (k === "r") reset();
  if (k === "1") S.force = null;
  if (k === "2") S.force = "gian";
  if (k === "3") S.force = "vui";
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());

const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function say(msg) { S.toast.push({ msg, ttl: 120 }); if (S.toast.length > 3) S.toast.shift(); }
function nearTable() {              // chỉ số bàn gần nhất trong tầm với, -1 nếu không có
  let best = -1, bd = C.radius;
  C.tables.forEach((t, i) => { const d = dist([S.p.x, S.p.z], t); if (d <= bd) { bd = d; best = i; } });
  return best;
}
function interact() {
  const p = [S.p.x, S.p.z];
  if (dist(p, C.stove) <= C.radius) {
    if (S.stove.state === "idle" && !S.hand && S.stock.ca_loc > 0) { S.stock.ca_loc--; S.stove = { state: "cooking", left: C.cook * 60 }; say("Bắt đầu nướng cá lóc"); }
    else if (S.stove.state === "ready" && !S.hand) { S.hand = "ca_loc_nuong_trui"; S.stove = { state: "idle", left: 0 }; say("Đã lấy món"); }
    else say("Chưa làm được việc đó");
  } else if (nearTable() >= 0) {
    const cu = S.tables[nearTable()].cust;
    if (S.hand && cu && cu.state === "waiting") {
      cu.state = "eating"; cu.left = C.eat * 60; S.hand = null;
      const tip = cu.pat > 0.5 * C.patience * 60 ? Math.round(C.price * 0.2) : 0;
      S.money += C.price + tip; S.served++; S.rep = Math.min(5, S.rep + (tip ? 0.2 : 0));
      say(`+${C.price}k` + (tip ? ` (+${tip}k boa)` : ""));
    } else say("Bàn chưa cần món này");
  } else say("Đứng gần bếp hoặc bàn rồi nhấn E");
}

function step() {
  S.t++;
  if (S.left > 0) S.left--;
  // di chuyển
  const dx = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
  const dz = (keys.has("w") || keys.has("arrowup") ? 1 : 0) - (keys.has("s") || keys.has("arrowdown") ? 1 : 0);
  const n = Math.hypot(dx, dz) || 1, v = C.speed / 60;
  S.p.moving = !!(dx || dz);
  if (S.p.moving) {
    S.p.x = Math.max(0.6, Math.min(15.4, S.p.x + (dx / n) * v));
    S.p.z = Math.max(0.5, Math.min(9.4, S.p.z + (dz / n) * v));
    S.p.face = Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? "r" : "l") : (dz > 0 ? "u" : "d");
  }
  // bếp
  if (S.stove.state === "cooking" && --S.stove.left <= 0) { S.stove = { state: "ready", left: 0 }; say("Món chín rồi!"); }
  // khách
  S.tables.forEach((tb, i) => {
    if (!tb.cust && S.t >= tb.next && S.left > 0) tb.cust = { state: "waiting", pat: C.patience * 60, left: 0, kind: S.kindNext++ % KINDS };
    const cu = tb.cust;
    if (!cu) return;
    if (cu.state === "waiting" && --cu.pat <= 0) { S.rep = Math.max(0, S.rep - 0.5); say("Khách bỏ đi (-0.5 uy tín)"); tb.cust = null; tb.next = S.t + (6 + i * 2) * 60; }
    else if (cu.state === "eating" && --cu.left <= 0) { tb.cust = null; tb.next = S.t + (6 + i * 2) * 60; }
  });
  S.score = Math.round(S.money + S.rep * 100);
  S.toast.forEach((t) => t.ttl--); S.toast = S.toast.filter((t) => t.ttl > 0);
}

// ---------- vẽ: nền, nước, xuồng ----------
function glow(cx, cy, r, c) {                       // vệt sáng pixel (dither), không mờ
  g.fillStyle = c;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    const d = Math.hypot(x, y);
    if (d <= r && ((x + y + 100) & 1) === 0 && d > r * 0.35) g.fillRect(cx + x, cy + y, 1, 1);
  }
}
function drawWater(t) {
  R(P.night, 0, 0, W, H);
  for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) {
    const o = (Math.floor(t / 20) + (y >> 2)) & 3;
    if ((((x >> 2) + (y >> 2) * 3 + o) & 7) === 0) R(P.water2, x, y, 4, 1);
    if ((((x >> 2) * 5 + (y >> 2) + (o >> 1)) % 13) === 0) R(P.water1, x, y + 2, 6, 1);
  }
  // sóng viền quanh xuồng
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * 2 * Math.PI, wob = Math.sin(t / 40 + i) > 0.6;
    if (wob) px(P.foam, BX + BW / 2 + Math.cos(a) * (BW / 2 + 7), BY + BH / 2 + Math.sin(a) * (BH / 2 + 7));
  }
}
function drawDeck() {
  R(P.rim2, BX - 5, BY - 5, BW + 10, BH + 10);
  R(P.rim, BX - 4, BY - 4, BW + 8, BH + 8);
  for (let y = 0; y < BH; y += 8) {                       // ván gỗ ngang
    for (let x = 0; x < BW; x += 1) { /* nền */ }
    R(y / 8 % 2 ? P.wood1 : "#b07a44", BX, BY + y, BW, 7);
    R(P.wood3, BX, BY + y + 7, BW, 1);
    const off = (y / 8 * 53) % 96;
    for (let x = off; x < BW; x += 96) R(P.wood3, BX + x, BY + y, 1, 7);
    for (let k = 0; k < 3; k++) { const nx = (y * 7 + k * 83) % BW; px(P.wood2, BX + nx, BY + y + 3); px(P.wood2, BX + nx + 1, BY + y + 3); }
  }
  // vết sờn / bẩn
  [[40, 30, 9], [150, 92, 12], [210, 20, 7], [90, 130, 10], [30, 110, 8]].forEach(([x, y, w]) => R(P.stain, BX + x, BY + y, w, 2));
  // cọc mạn
  for (let x = 0; x <= BW; x += 32) { R(P.rim2, BX + x - 2, BY - 7, 4, 5); R(P.rim, BX + x - 2, BY + BH + 2, 4, 5); }
}
function lantern(x, y, t) {
  const f = 1 + (Math.sin(t / 15 + x) > 0.8 ? 1 : 0);
  glow(x, y + 4, 14 + f, "rgba(255,200,90,.35)");
  R(P.rim2, x - 1, y - 7, 2, 4);
  R(P.redD, x - 4, y - 3, 8, 11); R(P.red, x - 3, y - 3, 6, 10);
  R(P.glow, x - 1, y, 2, 4); R(P.rim2, x - 3, y - 3, 6, 1); R(P.rim2, x - 3, y + 6, 6, 1);
  R(P.glow, x, y + 8, 1, 3);
}

// ---------- vẽ: bếp ----------
function drawStove(t) {
  const x = sx(C.stove[0]) - 10, y = sy(C.stove[1]) - 10;
  R("rgba(0,0,0,.25)", x + 1, y + 20, 20, 3);
  R(P.metalD, x, y + 6, 20, 14); R(P.metal, x + 1, y + 7, 18, 12);
  for (let i = 0; i < 3; i++) R(P.metalD, x + 3 + i * 6, y + 12, 3, 5);           // khe lò
  R(P.ink, x + 2, y + 18, 16, 1);
  const st = S.stove.state;
  if (st !== "idle") {                                                                // lửa
    for (let i = 0; i < 3; i++) {
      const h = 3 + ((t / 5 + i * 2) & 3);
      R(P.fire, x + 3 + i * 6, y + 17 - h, 3, h); R(P.fireY, x + 4 + i * 6, y + 17 - Math.max(1, h - 2), 1, Math.max(1, h - 2));
    }
  }
  R(P.metalD, x + 2, y + 1, 16, 6); R(st === "ready" ? "#8a6a3a" : "#3b3f46", x + 3, y + 2, 14, 4);   // nồi
  R(P.metalD, x - 2, y + 3, 3, 2); R(P.metalD, x + 19, y + 3, 3, 2);                   // quai
  if (st === "cooking") for (let i = 0; i < 3; i++) {                                 // hơi
    const k = (t / 3 + i * 17) % 28; px(P.steam, x + 6 + i * 4 + Math.round(Math.sin(k / 4 + i) * 1.5), y - k / 2); R(P.steam, x + 6 + i * 4, y - 2 - k / 2, 1, 1);
  }
  if (st === "ready") { glow(x + 10, y + 4, 13, "rgba(123,214,107,.5)"); R(P.green, x + 5, y + 2, 10, 2); px(P.green, x + 9, y - 3 - ((t >> 4) & 1)); px(P.green, x + 10, y - 4 - ((t >> 4) & 1)); }
}

// ---------- vẽ: bàn + khách ----------
function dishIcon(x, y, name) {                                  // 12x7
  if (name === "ca_loc_nuong_trui") { R("#d6e0a0", x, y + 1, 12, 5); R("#7c9a52", x + 1, y + 2, 9, 3); R("#2e1a0c", x + 3, y + 3, 1, 1); R("#7c9a52", x + 10, y, 2, 7); R("#3f6b2c", x + 1, y + 6, 10, 1); }
  else if (name === "goi_bong_sung") { R("#efe6d0", x + 1, y + 2, 10, 5); R("#e8799c", x + 3, y, 6, 3); R("#7bd66b", x + 4, y + 3, 4, 2); }
  else { R("#efe6d0", x + 1, y + 3, 10, 4); R("#f2c230", x + 3, y + 1, 2, 2); R("#f2c230", x + 7, y + 2, 2, 2); R(P.steam, x + 5, y - 1, 1, 2); }
}
const KINDS = 5;                       // 0 chó nâu · 1 chó xám · 2 Chiikawa · 3 Hachiware · 4 Usagi
function drawTable(i, t) {
  const cx = sx(C.tables[i][0]), cy = sy(C.tables[i][1]), cu = S.tables[i].cust;
  R("rgba(0,0,0,.25)", cx - 14, cy + 11, 28, 4);
  R(P.rim2, cx - 6, cy + 9, 12, 5);                                       // ghế đẩu phía trước
  R(P.wood3, cx - 5, cy + 8, 10, 4);
  for (let y = -12; y <= 12; y++) {                                       // mặt bàn tròn
    const w = Math.round(Math.sqrt(144 - y * y) * 1.12);
    R(P.wood3, cx - w - 1, cy + y, 2 * w + 2, 1);
    R(Math.abs(y) % 4 === 0 ? P.wood1 : "#bb8248", cx - w, cy + y, 2 * w, 1);
  }
  R(P.wood2, cx - 5, cy - 2, 8, 1);
  if (cu && cu.state === "eating") dishIcon(cx - 6, cy - 4, "ca_loc_nuong_trui");
}
function custMood(cu) {
  if (S.force) return S.force;
  if (cu.state === "eating") return "an";
  return cu.pat < 0.25 * C.patience * 60 ? "gian" : "cho";
}
// khách dạng cục tròn (Chiikawa, Hachiware, Usagi): sp = { body, shade, ears(cx,cy), cap(cx,cy) }
function drawBlob(cx, cy, m, sp) {
  const K = "#3a2a2a", Bl = "#f6a5b0";
  sp.ears(cx, cy);
  R(K, cx - 12, cy + 6, 3, 6); R(sp.body, cx - 11, cy + 7, 2, 4);                         // tay
  R(K, cx + 9, cy + 6, 3, 6); R(sp.body, cx + 10, cy + 7, 2, 4);
  R(K, cx - 8, cy - 6, 16, 1); R(K, cx - 10, cy - 5, 20, 19); R(K, cx - 8, cy + 14, 16, 1);   // viền thân tròn
  R(sp.body, cx - 7, cy - 5, 14, 1); R(sp.body, cx - 9, cy - 4, 18, 17); R(sp.body, cx - 7, cy + 13, 14, 1);
  R(sp.shade, cx - 9, cy + 10, 18, 3); R(sp.shade, cx - 7, cy + 13, 14, 1);
  if (sp.cap) sp.cap(cx, cy);
  R(K, cx - 7, cy + 15, 5, 2); R(K, cx + 2, cy + 15, 5, 2);                               // chân
  R(Bl, cx - 8, cy + 5, 3, 2); R(Bl, cx + 5, cy + 5, 3, 2);                               // má hồng
  if (m === "an") {                                                                         // mắt nhắm ^ ^
    [-6, 3].forEach((ex) => { px(K, cx + ex, cy + 4); R(K, cx + ex + 1, cy + 3, 2, 1); px(K, cx + ex + 3, cy + 4); });
    R(K, cx - 2, cy + 6, 4, 2); R(Bl, cx - 1, cy + 7, 2, 1);
  } else if (m === "gian") {
    R(K, cx - 6, cy + 2, 2, 3); R(K, cx + 4, cy + 2, 2, 3);
    R(K, cx - 7, cy, 4, 1); R(K, cx - 4, cy + 1, 1, 1); R(K, cx + 3, cy, 4, 1); R(K, cx + 3, cy + 1, 1, 1);   // lông mày chau
    R(K, cx - 2, cy + 7, 4, 1); px(K, cx - 3, cy + 8); px(K, cx + 2, cy + 8);
  } else if (m === "vui") {
    R(K, cx - 6, cy + 2, 2, 4); R(K, cx + 4, cy + 2, 2, 4); px("#fff", cx - 6, cy + 2); px("#fff", cx + 4, cy + 2);
    R(K, cx - 2, cy + 6, 4, 3); R(Bl, cx - 1, cy + 8, 2, 1);
    px("#ffe27a", cx - 12, cy - 3); px("#ffe27a", cx - 13, cy - 2); px("#ffe27a", cx - 11, cy - 2); px("#ffe27a", cx - 12, cy - 1);   // lấp lánh
  } else {
    R(K, cx - 6, cy + 2, 2, 3); R(K, cx + 4, cy + 2, 2, 3); px("#fff", cx - 6, cy + 2); px("#fff", cx + 4, cy + 2);
    R(K, cx - 1, cy + 6, 2, 1);
  }
}
const K_ = "#3a2a2a";
const SPR = {
  2: { body: "#fffaf4", shade: "#ecdcd0",                                                  // Chiikawa: tai tròn nhỏ
    ears(cx, cy) { R(K_, cx - 8, cy - 8, 5, 5); R("#fffaf4", cx - 7, cy - 7, 3, 3); R("#f6a5b0", cx - 6, cy - 6, 1, 1); R(K_, cx + 3, cy - 8, 5, 5); R("#fffaf4", cx + 4, cy - 7, 3, 3); R("#f6a5b0", cx + 5, cy - 6, 1, 1); } },
  3: { body: "#fffaf4", shade: "#ecdcd0",                                                  // Hachiware: tai nhọn xanh, mũ xanh có chữ V trắng
    ears(cx, cy) { const B = "#7fb6e6"; for (let i = 0; i < 5; i++) { R(K_, cx - 9, cy - 10 + i, i + 2, 1); R(K_, cx + 8 - i, cy - 10 + i, i + 2, 1); if (i) { R(B, cx - 8, cy - 10 + i, i, 1); R(B, cx + 9 - i, cy - 10 + i, i, 1); } } },
    cap(cx, cy) { const B = "#7fb6e6"; R(B, cx - 7, cy - 5, 14, 1); R(B, cx - 9, cy - 4, 18, 5); R("#fffaf4", cx - 1, cy - 4, 2, 1); R("#fffaf4", cx - 2, cy - 3, 4, 1); R("#fffaf4", cx - 3, cy - 2, 6, 1); R("#fffaf4", cx - 4, cy - 1, 8, 1); R("#5d97cc", cx - 9, cy + 1, 18, 1); } },
  4: { body: "#ffe58a", shade: "#e8c75a",                                                  // Usagi: tai dài dựng đứng
    ears(cx, cy) { R(K_, cx - 7, cy - 19, 5, 14); R("#ffe58a", cx - 6, cy - 18, 3, 13); R("#f6a5b0", cx - 5, cy - 15, 1, 8); R(K_, cx + 2, cy - 19, 5, 14); R("#ffe58a", cx + 3, cy - 18, 3, 13); R("#f6a5b0", cx + 4, cy - 15, 1, 8); } },
};
function drawCustomer(i, t) {
  const cu = S.tables[i].cust;
  if (!cu) return;
  const m = custMood(cu), cx = sx(C.tables[i][0]), cy = sy(C.tables[i][1]) - 25 + (m === "an" && (t >> 3 & 1) ? 1 : 0);
  R("rgba(0,0,0,.25)", cx - 9, cy + 18, 18, 3);
  if (SPR[cu.kind]) drawBlob(cx, cy, m, SPR[cu.kind]); else drawDog(cx, cy, m, cu.kind);
  // bong bóng đặt món
  if (cu.state === "waiting" || S.force) {
    const bx = cx + 10, by = cy - 26 + (((t >> 4) & 1) ? 0 : 1);
    R(P.ink, bx - 1, by - 1, 22, 17); R("#fffaf0", bx, by, 20, 15);
    R(P.ink, bx + 2, by + 15, 4, 3); R("#fffaf0", bx + 3, by + 15, 2, 2);
    dishIcon(bx + 4, by + 4, "ca_loc_nuong_trui");
  }
  if (m === "gian") { R(P.ink, cx - 12, cy - 12, 1, 1); R("#e5493a", cx - 12, cy - 9, 3, 1); R("#e5493a", cx - 11, cy - 11, 1, 3); }
}
function drawDog(cx, cy, m, kind) {
  const fur = kind ? "#cfd3d6" : P.fur, furD = kind ? "#8d9399" : P.furD;
  R("#7a3b2e", cx - 8, cy + 8, 16, 12); R("#9b4d3b", cx - 7, cy + 9, 14, 10);        // thân (áo)
  R(P.ear, cx - 12, cy - 3, 5, 11); R(P.ear, cx + 7, cy - 3, 5, 11);                  // tai cụp
  R(furD, cx - 8, cy - 5, 16, 15); R(fur, cx - 7, cy - 4, 14, 13);                    // đầu
  R("#efe6d0", cx - 4, cy + 3, 8, 6);                                                  // mõm
  R(P.ink, cx - 2, cy + 2, 4, 2);                                                      // mũi
  // mắt + miệng theo nét mặt
  const eye = (ex) => { R("#fff", ex, cy - 1, 4, 4); R(P.ink, ex + (m === "gian" ? 1 : 1), cy + (m === "gian" ? 1 : 0), 2, 2); };
  eye(cx - 6); eye(cx + 2);
  if (m === "gian") { R(P.ink, cx - 7, cy - 3, 5, 1); R(P.ink, cx - 6, cy - 2, 3, 1); R(P.ink, cx + 2, cy - 3, 5, 1); R(P.ink, cx + 3, cy - 2, 3, 1); R(P.ink, cx - 3, cy + 7, 6, 1); R(P.ink, cx - 4, cy + 8, 1, 1); R(P.ink, cx + 3, cy + 8, 1, 1); }
  else if (m === "vui") { R(P.ink, cx - 4, cy + 7, 8, 1); R(P.ink, cx - 3, cy + 8, 6, 1); R("#e8798c", cx - 2, cy + 8, 4, 1); R("#f2a0a8", cx - 8, cy + 4, 2, 1); R("#f2a0a8", cx + 6, cy + 4, 2, 1); }
  else if (m === "an") { R(P.ink, cx - 3, cy + 7, 6, 2); R("#e8798c", cx - 2, cy + 8, 4, 1); R(P.ink, cx - 6, cy + 1, 4, 1); R(P.ink, cx + 2, cy + 1, 4, 1); }
  else { R(P.ink, cx - 3, cy + 8, 6, 1); }
}
function patienceBar(i) {
  const cu = S.tables[i].cust;
  if (!cu || cu.state !== "waiting") return;
  const cx = sx(C.tables[i][0]) - 12, cy = sy(C.tables[i][1]) + 17, f = cu.pat / (C.patience * 60);
  R(P.ink, cx - 1, cy - 1, 26, 5); R("#4a2b14", cx, cy, 24, 3);
  R(f > 0.5 ? P.green : f > 0.25 ? P.fireY : "#e5493a", cx, cy, Math.round(24 * f), 3);
}

// ---------- vẽ: Út Sen ----------
function drawPlayer(t) {
  const x = sx(S.p.x), y = sy(S.p.z), f = S.p.face;
  const bob = S.p.moving ? ((t >> 3) & 1) : 0, step = S.p.moving && ((t >> 3) & 1);
  R("rgba(0,0,0,.3)", x - 6, y + 1, 12, 3);
  // chân
  R(P.skinD, x - 4, y - 3 + (step ? 0 : 1), 3, 4); R(P.skinD, x + 1, y - 3 + (step ? 1 : 0), 3, 4);
  const yy = y - 16 + bob;
  // thân: áo bà ba + tạp dề
  R(P.shirt, x - 5, yy + 8, 10, 8); R("#1f5a56", x - 5, yy + 8, 10, 1);
  if (f !== "u") { R(P.apron, x - 3, yy + 9, 6, 7); R(P.stain, x - 1, yy + 12, 3, 2); R(P.stain, x - 3, yy + 15, 2, 1); }
  else R("#1f5a56", x - 4, yy + 9, 8, 6);
  R(P.skin, x - 7, yy + 9 + (f === "l" || f === "r" ? 1 : 0), 2, 4); R(P.skin, x + 5, yy + 9, 2, 4);   // tay
  // đầu
  R(P.skinD, x - 5, yy + 2, 10, 8); R(P.skin, x - 4, yy + 3, 8, 6);
  if (f === "d") { R(P.ink, x - 3, yy + 5, 2, 2); R(P.ink, x + 1, yy + 5, 2, 2); R("#fff", x - 3, yy + 5, 1, 1); R("#fff", x + 1, yy + 5, 1, 1); R("#c8504a", x - 1, yy + 8, 2, 1); R("#f0a090", x - 4, yy + 7, 1, 1); R("#f0a090", x + 3, yy + 7, 1, 1); }
  else if (f === "r") { R(P.ink, x + 1, yy + 5, 2, 2); R("#fff", x + 1, yy + 5, 1, 1); R("#c8504a", x + 2, yy + 8, 2, 1); }
  else if (f === "l") { R(P.ink, x - 3, yy + 5, 2, 2); R("#fff", x - 3, yy + 5, 1, 1); R("#c8504a", x - 4, yy + 8, 2, 1); }
  else { R("#3a2416", x - 4, yy + 3, 8, 6); }                                          // sau gáy: tóc
  // nón lá (hình nón)
  R(P.hatD, x - 9, yy + 3, 18, 2); R(P.hat, x - 8, yy + 2, 16, 1);
  R(P.hatD, x - 6, yy, 12, 2); R(P.hat, x - 4, yy - 2, 8, 2); R(P.hatD, x - 2, yy - 4, 4, 2); R(P.hat, x - 1, yy - 5, 2, 1);
  R(P.red, x - 5, yy + 5, 1, 4); R(P.red, x + 4, yy + 5, 1, 4);                       // quai nón
  // món đang cầm
  if (S.hand) { R(P.ink, x - 8, yy - 12, 16, 11); R("#fffaf0", x - 7, yy - 11, 14, 9); dishIcon(x - 6, yy - 10, S.hand); }
  // gợi ý E
  const near = dist([S.p.x, S.p.z], C.stove) <= C.radius || nearTable() >= 0;
  if (near && ((t >> 4) & 1) === 0 || near) {
    const ky = yy - (S.hand ? 26 : 14);
    R(P.ink, x - 5, ky, 11, 11); R("#fff6d8", x - 4, ky + 1, 9, 8); R("#d9c58a", x - 4, ky + 9, 9, 1);
    R(P.ink, x - 2, ky + 2, 1, 6); R(P.ink, x - 1, ky + 2, 3, 1); R(P.ink, x - 1, ky + 4, 2, 1); R(P.ink, x - 1, ky + 7, 3, 1);
  }
  // vòng tương tác (chấm chấm)
  const r = C.radius * U;
  for (let a = 0; a < 48; a += 2) { const q = a / 48 * 2 * Math.PI; px("rgba(255,240,180,.55)", x + Math.cos(q) * r, y - 2 + Math.sin(q) * r * 0.7); }
}

// ---------- HUD (vẽ ở độ phân giải màn hình, chữ rõ nét) ----------
let SC = 3, OX = 0, OY = 0;
function T(s, x, y, o = {}) {
  ctx.font = `${o.bold === false ? "" : "bold "}${(o.size || 7) * SC}px "Courier New", monospace`;
  ctx.textAlign = o.align || "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = o.shadow || "#1a0e06"; ctx.fillText(s, OX + (x + 0.5) * SC, OY + (y + 0.5) * SC + SC);
  ctx.fillStyle = o.color || "#fff2cf"; ctx.fillText(s, OX + (x + 0.5) * SC, OY + (y + 0.5) * SC);
}
function drawHudLow() {           // khung gỗ + icon (pixel)
  R(P.rim2, 0, 0, W, 24); R(P.rim, 0, 0, W, 22); R(P.wood2, 0, 0, W, 20); R(P.wood1, 0, 0, W, 2);
  for (let x = 0; x < W; x += 24) R(P.wood3, x, 2, 1, 18);
  // đồng hồ
  R(P.ink, 6, 4, 12, 12); R("#fff6d8", 7, 5, 10, 10); R(P.ink, 11, 7, 1, 4); R(P.ink, 11, 10, 3, 1);
  // đồng xu
  R(P.ink, 66, 4, 12, 12); R("#f2c230", 67, 5, 10, 10); R("#ffe27a", 68, 6, 3, 3); R("#b8861a", 71, 8, 1, 5);
  // sao uy tín
  for (let i = 0; i < 5; i++) {
    const x = 150 + i * 13, full = S.rep >= i + 1, half = !full && S.rep > i + 0.25;
    const col = full ? "#ffd23f" : half ? "#d9b34a" : "#6e4a2a";
    R(P.ink, x, 4, 12, 12); R(col, x + 1, 5, 10, 10); R(full || half ? "#fff0a0" : "#8a6038", x + 2, 6, 2, 2);
    R(P.ink, x + 5, 7, 2, 5); R(P.ink, x + 3, 9, 6, 1);
  }
  // thanh dưới: kho
  R(P.rim2, 0, H - 14, W, 14); R(P.rim, 0, H - 13, W, 13);
}
function drawHudText() {
  const s = Math.ceil(S.left / 60);
  T(`${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`, 21, 10, { size: 8, color: s <= 20 ? "#ff8a7a" : "#fff2cf" });
  T(`${S.money}k`, 81, 10, { size: 8, color: "#ffe27a" });
  T(`ĐIỂM ${S.score}`, 224, 10, { size: 7 });
  const st = S.stock;
  T(`KHO  cá lóc ${st.ca_loc} · cá linh ${st.ca_linh} · điên điển ${st.bong_dien_dien} · bông súng ${st.bong_sung}`, 6, H - 7, { size: 5.5, color: "#ffe9b0" });
  T("WASD đi · E tương tác", W - 6, H - 7, { size: 5.5, align: "right", color: "#e0c58f" });
  // nhãn trạm
  const lab = (txt, x, y) => T(txt, x, y, { size: 5, align: "center", color: "#ffe9b0" });
  lab("BẾP " + ({ idle: "(nghỉ)", cooking: Math.ceil(S.stove.left / 60) + "s", ready: "CHÍN!" })[S.stove.state], sx(C.stove[0]), sy(C.stove[1]) - 16);
  C.tables.forEach((tb, i) => lab("BÀN T" + (i + 1), sx(tb[0]), sy(tb[1]) + 27));
  // thông báo
  S.toast.forEach((t, i) => T(t.msg, W / 2, 36 + i * 9, { size: 6.5, align: "center", color: t.ttl < 30 ? "rgba(255,242,207,.5)" : "#fff2cf" }));
  if (S.left <= 0) {
    ctx.fillStyle = "rgba(10,20,26,.7)"; ctx.fillRect(OX, OY + 70 * SC, W * SC, 60 * SC);
    T("KẾT CA", W / 2, 90, { size: 14, align: "center", color: "#ffd23f" });
    T(`${S.served} khách · ${S.money}k · uy tín ${S.rep.toFixed(1)} · điểm ${S.score}`, W / 2, 108, { size: 7, align: "center" });
    T("Nhấn R để chơi lại", W / 2, 120, { size: 6, align: "center", color: "#e0c58f" });
  }
  T("MẪU GIAO DIỆN · 1 chờ  2 giận  3 vui (xem nét mặt khách)", W / 2, 29, { size: 4.5, align: "center", color: "rgba(255,255,255,.55)", bold: false });
}

// ---------- vòng lặp ----------
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  const t = S.t;
  drawWater(t); drawDeck();
  lantern(BX + 2, BY - 2, t); lantern(BX + BW - 2, BY - 2, t); lantern(BX + 2, BY + BH + 4, t); lantern(BX + BW - 2, BY + BH + 4, t);
  // vẽ theo chiều sâu: z lớn (xa) trước
  const items = [
    { z: C.stove[1], f: () => drawStove(t) },
    { z: S.p.z, f: () => drawPlayer(t) },
    ...C.tables.map((tb, i) => ({ z: tb[1] + 0.1, f: () => { drawTable(i, t); drawCustomer(i, t); patienceBar(i); } })),
  ].sort((a, b) => b.z - a.z);
  items.forEach((i) => i.f());
  // bóng tối ban đêm nhẹ ở rìa
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    const d = Math.hypot(x - W / 2, y - H / 2) / Math.hypot(W / 2, H / 2);
    if (d > 0.82 && ((x + y) & 3) === 0) px("rgba(5,15,22,.45)", x, y);
  }
  drawHudLow();
  // phóng nguyên số nguyên
  const w = innerWidth, h = innerHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  SC = Math.max(1, Math.floor(Math.min(cv.width / W, cv.height / H)));
  OX = Math.floor((cv.width - W * SC) / 2); OY = Math.floor((cv.height - H * SC) / 2);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#0b1a22"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(lo, 0, 0, W, H, OX, OY, W * SC, H * SC);
  drawHudText();
}
requestAnimationFrame(frame);
</script>

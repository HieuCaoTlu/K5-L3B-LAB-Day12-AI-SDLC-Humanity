<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: calc(100vh - 44px); margin-top: 44px; }
  #menubar { position: fixed; left: 0; top: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: #1d2b36; border-bottom: 2px solid #3a4f5f; z-index: 10; box-sizing: border-box; }
  #menubar b { margin-right: 8px; color: #ffe082; }
  #menubar button { padding: 5px 12px; border-radius: 10px; border: 2px solid #5f7b8f; background: #2c4152; color: #e8eef2; cursor: pointer; font: 14px system-ui; }
  #menubar button:hover:not(:disabled) { background: #3b566b; }
  #menubar button:disabled { opacity: .4; cursor: not-allowed; }
  #rules { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); width: min(560px, 92vw); max-height: calc(100vh - 80px); overflow: auto;
    background: #fff8e1; color: #4e342e; border: 3px solid #8d6e63; border-radius: 16px; padding: 14px 18px; z-index: 9; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #rules h3 { margin: 0 0 8px; } #rules ul { margin: 4px 0 8px; padding-left: 20px; } #rules li { margin: 3px 0; }
  #audioSpacer { flex: 1; }
  #audioPanel { position: fixed; right: 12px; top: 52px; width: 250px; background: #1d2b36; color: #e8eef2; border: 2px solid #5f7b8f;
    border-radius: 14px; padding: 12px 14px; z-index: 12; display: none; box-shadow: 0 10px 26px rgba(0,0,0,.6); font: 13px system-ui, sans-serif; }
  #audioPanel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; }
  #audioPanel input[type="range"] { width: 120px; accent-color: #ffe082; cursor: pointer; }
  #audioPanel button { margin-top: 6px; padding: 4px 10px; border-radius: 8px; border: 1px solid #5f7b8f; background: #2c4152; color: #e8eef2; cursor: pointer; font-size: 12px; }
  #audioPanel button:hover { background: #3b566b; }
</style>
</head>
<body>
<div id="menubar">
  <b>🛶 Chợ Nổi</b>
  <button id="btnRules">📖 Luật chơi</button>
  <button id="btnUpg">⬆ Nâng cấp</button>
  <button id="btnNext">▶ Ngày tiếp theo</button>
  <button id="btnRetry">↻ Làm lại</button>
  <button id="btnNew">⏮ Chơi lại từ đầu</button>
  <span id="audioSpacer"></span>
  <button id="btnAudio" title="Bật/tắt nhạc &amp; âm thanh (M)">🔊 Âm thanh</button>
  <button id="btnAudioCfg" title="Cài đặt âm lượng">🎚</button>
</div>
<div id="audioPanel">
  <div style="font-weight:700;color:#ffe082;margin-bottom:6px">🎵 Âm thanh Quán (Buổi tối)</div>
  <label><span>Nhạc nền</span><input id="volBgm" type="range" min="0" max="100" value="44"></label>
  <label><span>Sông đêm</span><input id="volAmb" type="range" min="0" max="100" value="30"></label>
  <label><span>Hiệu ứng</span><input id="volSfx" type="range" min="0" max="100" value="80"></label>
  <div style="display:flex;gap:6px;justify-content:space-between">
    <button id="btnAudioTest">🔔 Thử chuông</button>
    <button id="btnAudioClose">Đóng</button>
  </div>
</div>
<div id="rules" class="pxm"></div>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- Âm thanh phần Quán (Web Audio API tự tổng hợp trực tiếp trong index.html) ----------
(function (global) {
  const STORAGE_KEY = "chonoi_quan_audio_v1";
  const N = {
    F2: 41, G2: 43, A2: 45, Bb2: 46, C3: 48, D3: 50, E3: 52, F3: 53, G3: 55, A3: 57, Bb3: 58,
    C4: 60, D4: 62, E4: 64, F4: 65, "F#4": 66, G4: 67, A4: 69, Bb4: 70, B4: 71,
    C5: 72, D5: 74, E5: 76, F5: 77, "F#5": 78, G5: 79, A5: 81, Bb5: 82, B5: 83,
    C6: 84, D6: 86, F6: 89, A6: 93,
  };
  const hz = (n) => (N[n] ? 440 * Math.pow(2, (N[n] - 69) / 12) : 440);

  // 16 ô nhịp F ngũ cung Nam Bộ (Đêm Chợ Nổi — ~111 BPM)
  const NIGHT_CHORDS = [
    ["F2", ["A3", "C4", "E4"]], ["D2", ["F3", "A3", "C4"]], ["G2", ["Bb3", "D4", "F4"]], ["C2", ["G3", "Bb3", "E4"]],
    ["F2", ["A3", "C4", "E4"]], ["A2", ["C4", "E4", "G4"]], ["Bb2", ["D4", "F4", "G4"]], ["C2", ["G3", "Bb3", "D4"]],
    ["Bb2", ["D4", "F4", "A4"]], ["C2", ["G3", "Bb3", "E4"]], ["D2", ["F3", "A3", "C4"]], ["G2", ["D4", "F4", "A4"]],
    ["F2", ["A3", "C4", "E4"]], ["D2", ["F3", "A3", "C4"]], ["G2", ["Bb3", "D4", "F4"]], ["C2", ["G3", "Bb3", "E4"]],
  ];
  // [beat, note, durBeats, vel, bendCents] — Đàn Tranh (A) + điểm xuyết (B)
  const NIGHT_PLUCK = [
    [0, "C5", .75, .85, -35], [.75, "D5", .5, .78, 0], [1.25, "F5", .75, .90, -40], [2, "G5", .75, .86, 0], [2.75, "A5", 1.25, .92, -30],
    [4.25, "G5", .5, .80, 0], [4.75, "F5", .75, .84, 0], [5.5, "D5", .75, .82, -25], [6.25, "C5", .75, .78, 0], [7, "A4", 1, .76, 0],
    [8, "D5", .5, .82, -25], [8.5, "F5", .5, .85, 0], [9, "G5", .75, .88, -35], [9.75, "F5", .5, .80, 0], [10.25, "D5", .75, .82, 0], [11, "C5", 1, .78, 0],
    [12, "G4", .75, .76, 0], [12.75, "A4", .75, .80, -25], [13.5, "C5", 1.25, .86, 0], [15, "D5", .5, .74, 0], [15.5, "E5", .5, .76, 0],
    [16, "F5", .75, .90, -35], [16.75, "A5", .75, .92, 0], [17.5, "C6", .75, .90, -30], [18.25, "A5", .75, .86, 0], [19, "G5", .5, .82, 0], [19.5, "F5", .5, .80, 0],
    [20, "E5", .75, .82, 0], [20.75, "D5", .75, .80, -25], [21.5, "C5", 1, .84, 0], [22.75, "A4", .5, .74, 0], [23.25, "C5", .75, .78, 0],
    [24, "D5", .5, .82, -30], [24.5, "F5", .5, .86, 0], [25, "D5", .5, .80, 0], [25.5, "C5", .5, .78, 0], [26, "A4", .75, .80, -25], [26.75, "G4", .75, .78, 0], [27.5, "A4", .5, .76, 0],
    [28, "G4", .75, .82, -25], [28.75, "F4", 1.25, .85, 0], [30.5, "C5", .5, .70, 0], [31, "D5", .5, .74, 0], [31.5, "F5", .5, .78, 0],
    [35, "G5", .5, .66, 0], [35.5, "F5", .5, .62, 0], [39, "G4", .5, .64, 0], [39.5, "A4", .5, .66, -25],
    [47, "D5", .5, .66, -25], [47.5, "E5", .5, .70, 0], [48, "F5", .75, .74, -30], [49.5, "G5", .5, .68, 0], [50, "A5", .5, .72, 0],
    [54.5, "A4", .5, .64, 0], [55, "C5", .5, .68, 0], [55.5, "D5", .5, .70, 0], [58, "Bb5", .5, .66, 0], [59, "G5", .5, .64, 0],
    [61.5, "G4", .5, .68, 0], [62.5, "A4", .5, .70, -25], [63.25, "Bb4", .75, .72, 0],
  ];
  // Sáo trúc đối đáp phần B
  const NIGHT_FLUTE = [
    [32, "D5", 1, .72, null], [33, "F5", 1, .76, "D5"], [34, "A5", 1.7, .80, "F5"],
    [36, "G5", 1, .74, "A5"], [37, "E5", 1, .70, "G5"], [38, "C5", 1.7, .72, "E5"],
    [40, "F5", .75, .74, null], [40.75, "A5", .75, .78, "F5"], [41.5, "G5", 1, .76, "A5"], [42.5, "F5", .75, .72, "G5"], [43.25, "D5", .75, .70, "F5"],
    [44, "G5", 1.25, .78, "D5"], [45.5, "E5", 1, .74, "G5"], [46.5, "C5", 1.2, .70, "E5"],
    [48, "A5", 1, .80, null], [49, "C6", 1.25, .82, "A5"], [50.5, "A5", .75, .76, "C6"], [51.25, "G5", .75, .74, "A5"],
    [52, "F5", 1, .76, "G5"], [53, "D5", 1, .72, "F5"], [54, "C5", 1.7, .72, "D5"],
    [56, "D5", .75, .72, null], [56.75, "F5", .75, .76, "D5"], [57.5, "G5", 1, .78, "F5"], [58.5, "F5", .75, .74, "G5"], [59.25, "D5", .75, .70, "F5"],
    [60, "C5", 1.5, .74, "D5"], [62, "A4", 1.5, .68, "C5"],
  ];

  // 8 ô nhịp G ngũ cung cao điểm (~133 BPM)
  const RUSH_CHORDS = [
    ["G2", ["B3", "D4", "F#4"]], ["E2", ["G3", "B3", "D4"]], ["A2", ["C4", "E4", "G4"]], ["D2", ["A3", "C4", "F#4"]],
    ["G2", ["B3", "D4", "F#4"]], ["B2", ["D4", "F#4", "A4"]], ["C2", ["E3", "G3", "A3"]], ["D2", ["A3", "C4", "F#4"]],
  ];
  const RUSH_MEL = [
    [0, "D5", .5, .90, -30], [.5, "E5", .5, .84, 0], [1, "G5", .5, .92, -35], [1.5, "A5", .5, .88, 0], [2, "B5", .75, .92, -25], [2.75, "A5", .5, .84, 0], [3.25, "G5", .75, .86, 0],
    [4, "E5", .5, .84, 0], [4.5, "G5", .5, .86, -25], [5, "A5", .75, .88, 0], [5.75, "G5", .5, .82, 0], [6.25, "E5", .75, .82, 0], [7, "D5", 1, .84, 0],
    [8, "E5", .5, .86, -25], [8.5, "G5", .5, .88, 0], [9, "A5", .5, .90, 0], [9.5, "B5", .5, .88, 0], [10, "A5", .75, .86, 0], [10.75, "G5", .5, .80, 0], [11.25, "E5", .75, .82, 0],
    [12, "D5", .5, .82, 0], [12.5, "E5", .5, .84, 0], [13, "G5", .75, .88, -30], [13.75, "A5", .75, .86, 0], [14.5, "F#5", .75, .82, 0], [15.25, "D5", .75, .78, 0],
    [16, "G5", .5, .92, -30], [16.5, "A5", .5, .88, 0], [17, "B5", .5, .92, 0], [17.5, "D6", .5, .92, -25], [18, "B5", .75, .88, 0], [18.75, "A5", .5, .84, 0], [19.25, "G5", .75, .86, 0],
    [20, "F#5", .5, .84, 0], [20.5, "A5", .5, .86, 0], [21, "B5", .75, .90, -30], [21.75, "A5", .5, .82, 0], [22.25, "F#5", .75, .80, 0], [23, "D5", 1, .80, 0],
    [24, "E5", .5, .88, -25], [24.5, "G5", .5, .90, 0], [25, "A5", .5, .92, 0], [25.5, "G5", .5, .86, 0], [26, "E5", .5, .86, 0], [26.5, "G5", .5, .88, 0], [27, "A5", 1, .90, 0],
    [28, "B5", .5, .90, -25], [28.5, "A5", .5, .86, 0], [29, "G5", .5, .84, 0], [29.5, "E5", .5, .82, 0], [30, "D5", .75, .86, 0], [30.75, "E5", .5, .82, 0], [31.25, "F#5", .75, .84, 0],
  ];

  const st = {
    ctx: null, master: null, bgm: null, amb: null, sfx: null, rev: null, revSend: null,
    noise: null, unlocked: false, muted: false, bgmVol: 0.44, ambVol: 0.30, sfxVol: 0.80,
    scene: "off", timer: null, ambTimer: null, ambNodes: null, beat: 0, nextT: 0,
    lastSfx: {}, onChange: null,
  };

  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!p) return;
      if (typeof p.muted === "boolean") st.muted = p.muted;
      if (typeof p.bgmVol === "number") st.bgmVol = Math.max(0, Math.min(1, p.bgmVol));
      if (typeof p.ambVol === "number") st.ambVol = Math.max(0, Math.min(1, p.ambVol));
      if (typeof p.sfxVol === "number") st.sfxVol = Math.max(0, Math.min(1, p.sfxVol));
    } catch (e) {}
  }
  function savePrefs() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ muted: st.muted, bgmVol: st.bgmVol, ambVol: st.ambVol, sfxVol: st.sfxVol })); } catch (e) {}
  }
  function notify() { if (typeof st.onChange === "function") st.onChange(getState()); }

  function ensureCtx() {
    if (st.ctx) return st.ctx;
    const AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return null;
    const ctx = st.ctx = new AC();
    st.master = ctx.createGain();
    st.bgm = ctx.createGain();
    st.amb = ctx.createGain();
    st.sfx = ctx.createGain();
    st.revSend = ctx.createGain();
    st.revSend.gain.value = 0.22;

    // Room reverb ấm áp cho đèn lồng chợ nổi
    const irLen = Math.floor(ctx.sampleRate * 0.72);
    const ir = ctx.createBuffer(2, irLen, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const ch = ir.getChannelData(c);
      let lp = 0;
      for (let i = 0; i < irLen; i++) {
        const w = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.19));
        lp = lp * 0.65 + w * 0.35;
        ch[i] = lp;
      }
    }
    st.rev = ctx.createConvolver();
    st.rev.buffer = ir;
    st.revSend.connect(st.rev);
    st.rev.connect(st.master);
    st.bgm.connect(st.master);
    st.amb.connect(st.master);
    st.sfx.connect(st.master);
    st.master.connect(ctx.destination);

    // Pink noise 2 giây cho sóng nước & percussion
    const nl = ctx.sampleRate * 2, nb = ctx.createBuffer(1, nl, ctx.sampleRate), nd = nb.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < nl; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.950 * b2 + w * 0.048;
      nd[i] = Math.max(-1, Math.min(1, (b0 + b1 + b2 + w * 0.18) * 1.4));
    }
    st.noise = nb;
    applyGains();
    return ctx;
  }

  function applyGains() {
    if (!st.ctx) return;
    const t = st.ctx.currentTime;
    st.master.gain.setTargetAtTime(st.muted ? 0 : 1, t, 0.025);
    st.bgm.gain.setTargetAtTime(st.bgmVol, t, 0.03);
    st.amb.gain.setTargetAtTime(st.ambVol, t, 0.04);
    st.sfx.gain.setTargetAtTime(st.sfxVol, t, 0.02);
  }

  function routeOut(ctx, node, dest, pan, revAmt) {
    let target = dest;
    const p = Math.max(-0.65, Math.min(0.65, pan || 0));
    if (typeof ctx.createStereoPanner === "function" && Math.abs(p) > 0.02) {
      const pn = ctx.createStereoPanner();
      pn.pan.value = p;
      pn.connect(dest);
      target = pn;
    }
    node.connect(target);
    if (revAmt && st.revSend && dest !== st.revSend) {
      const rg = ctx.createGain();
      rg.gain.value = revAmt;
      node.connect(rg);
      rg.connect(st.revSend);
    }
  }

  function playDanTranh(ctx, freq, t, dur, vel, bend) {
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const flt = ctx.createBiquadFilter(), g = ctx.createGain();
    o1.type = "triangle"; o2.type = "sine";
    o1.frequency.setValueAtTime(freq, t);
    o2.frequency.setValueAtTime(freq * 2.001, t);
    if (bend) {
      o1.detune.setValueAtTime(bend, t); o1.detune.linearRampToValueAtTime(0, t + 0.055);
      o2.detune.setValueAtTime(bend, t); o2.detune.linearRampToValueAtTime(0, t + 0.055);
    }
    flt.type = "lowpass"; flt.Q.value = 1.4;
    flt.frequency.setValueAtTime(Math.min(4400, freq * 5.2), t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(320, Math.min(1400, freq * 2.0)), t + Math.min(0.24, dur));
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(flt); o2.connect(g2); g2.connect(flt);
    flt.connect(g);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.22 * vel, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.06, dur));
    routeOut(ctx, g, st.bgm, 0.08, 0.26);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.04); o2.stop(t + dur + 0.04);
  }

  function playSaoTruc(ctx, freq, t, dur, vel, glideHz) {
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), vib = ctx.createOscillator();
    const vg = ctx.createGain(), g = ctx.createGain(), g2 = ctx.createGain();
    o1.type = "sine"; o2.type = "sine"; vib.type = "sine"; vib.frequency.value = 5.2;
    vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(10, t + Math.min(0.22, dur * 0.6));
    vib.connect(vg); vg.connect(o1.detune); vg.connect(o2.detune);
    if (glideHz) {
      o1.frequency.setValueAtTime(glideHz, t); o1.frequency.exponentialRampToValueAtTime(Math.max(20, freq), t + 0.055);
      o2.frequency.setValueAtTime(glideHz * 2, t); o2.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 2), t + 0.055);
    } else {
      o1.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq * 2, t);
    }
    g2.gain.value = 0.16;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.15 * vel, t + 0.045);
    g.gain.setValueAtTime(0.13 * vel, t + Math.max(0.05, dur - 0.07));
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.06, dur));
    routeOut(ctx, g, st.bgm, -0.10, 0.30);
    o1.start(t); o2.start(t); vib.start(t);
    o1.stop(t + dur + 0.04); o2.stop(t + dur + 0.04); vib.stop(t + dur + 0.04);
  }

  function playMarimba(ctx, freq, t, dur, vel) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.08 * vel, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    routeOut(ctx, g, st.bgm, -0.14, 0.14);
    o.connect(g); o.start(t); o.stop(t + dur + 0.03);
  }

  function playBass(ctx, freq, t, dur, vel) {
    const o = ctx.createOscillator(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(freq, t);
    flt.type = "lowpass"; flt.frequency.value = 580;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.28 * vel, t + 0.007);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(flt); flt.connect(g); g.connect(st.bgm);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function playPerc(ctx, kind, t, vel, dest, pan) {
    const out = dest || st.bgm;
    if (kind === "kick") {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(125, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.085);
      g.gain.setValueAtTime(0.20 * vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.connect(g); routeOut(ctx, g, out, pan || 0, 0); o.start(t); o.stop(t + 0.15);
    } else if (kind === "mo" || kind === "songloan") {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = kind === "songloan" ? "sine" : "triangle";

    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + (snap.day !== undefined ? " ngày " + snap.day : "") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text(snap.day !== undefined && snap.reason === "time" ? "Bấm \"Ngày tiếp theo\" trên menu" : "Bấm \"Làm lại\" trên menu", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- NỀN PIXEL ART cho gather: buổi sáng, lặn xuống làn nước xanh trong -----
// CHỈ là hình: vẽ trên canvas nhỏ (PX điểm ảnh / mét) rồi phóng to không làm mịn.
// Đồng hồ thật và ngẫu nhiên ở đây chỉ dùng cho hoạt ảnh UI, không đi vào sim (headless không chạy file này).
const PX = 4;        // điểm ảnh nghệ thuật mỗi mét
const SKY_M = 7;     // số mét trời phía trên mặt nước
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const PAL = {
  // trên bờ: trời sáng sớm trong, nắng ấm ở chân trời
  sky: ["#4aa3e8", "#6dbcf0", "#94d0f5", "#bfe4f8", "#e3f4fb", "#fff1d2"],
  sun: "#fffbe8", sunEdge: "#fff0b8", glow: "#fff6d6",
  cloudHi: "#ffffff", cloud: "#eef8fd", cloudLo: "#c9e3f2", bird: "#3d5a73",
  far: "#9fcfb4", farDark: "#84bc9e",
  wall: "#b98252", wallDark: "#8a5a32", roof: "#d9b56a", roofDark: "#a8843f", stilt: "#6b4a2b", window: "#3b2a1c",
  nipa: "#3f7d3a", nipaHi: "#6fae55",
  boat: "#7a4f2b", boatHi: "#a06a3a", hat: "#f0dca0", shirt: "#4f6fa8",
  wood: "#8b5e34", woodDark: "#5c3a1e", thatch: "#d9b56a", thatchDark: "#a8843f", lamp: "#ffe08a",
  // dưới nước: xanh ngọc sáng ở mặt -> xanh thẳm ở đáy
  water: ["#8fe3ea", "#5cc8dc", "#36a9cc", "#2489b8", "#1a6a9e", "#134f80", "#0d3762", "#092647"],
  surfHi: "#f2feff", surfLo: "#bff1f6", caustic: "rgba(235,255,255,.32)",
  hazeFar: "rgba(10,52,92,.30)", hazeMid: "rgba(8,38,72,.55)", rimMid: "rgba(120,200,215,.35)",
  sand: "#6fa9a6", sandHi: "#9fd0c4", sandLo: "#3f7480",
  rock: "#2e4f66", rockHi: "#4d7790", rockLo: "#1d3447",
  moss: "#4f9a52", mossHi: "#7cc464",
  coral: [["#ff6f91", "#ffb3c6"], ["#ff9a4d", "#ffc999"], ["#b07cff", "#d9c2ff"], ["#ffd166", "#fff0b0"], ["#ff5a6e", "#ff9fab"]],
  sponge: "#c8405e", spongeIn: "#6e1c33", star: "#ff8c42",
  jar: "#8a5530", jarHi: "#b5774a", jarLo: "#5e3519",
  kelp: [["#3f8f4f", "#5fb15a"], ["#2f7a52", "#4fa36a"]],
  bubble: "rgba(235,255,255,.85)", speck: "rgba(220,250,255,.35)", ray: "225,252,255", school: "rgba(12,48,82,.5)",
  vignette: "rgba(4,20,40,",
};

function rng32(seed) {  // PRNG có seed: nền giống nhau mỗi lần mở
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mkCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
function hexRgb(hx) { const n = parseInt(hx.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function px(g, c, x, y, w = 1, h = 1) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, c, cx, cy, r) {
  g.fillStyle = c;
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
}
// Dải màu theo chiều dọc: mỗi dải phẳng, chỉ hòa (dither Bayer) ở 40% cuối dải -> kiểu pixel art.
function ditherBands(g, x0, y0, w, h, colors) {
  const img = g.createImageData(w, h), cs = colors.map(hexRgb), n = cs.length - 1;
  for (let y = 0; y < h; y++) {
    const f = (y / Math.max(1, h - 1)) * n, i = Math.min(n - 1, Math.floor(f));
    const fr = Math.max(0, Math.min(1, (f - i - 0.6) / 0.4));
    for (let x = 0; x < w; x++) {
      const c = fr * 16 > BAYER[(y0 + y) & 3][(x0 + x) & 3] ? cs[i + 1] : cs[i];
      const o = (y * w + x) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }
  g.putImageData(img, x0, y0);
}
// Dãy đá mờ (bóng) theo profile chiều cao; dùng màu bán trong suốt để "chìm" vào nước.
function ridge(g, w, baseY, color, hFn, rim) {
  for (let x = 0; x < w; x++) {
    const hh = Math.max(0, Math.round(hFn(x)));
    if (!hh) continue;
    px(g, color, x, baseY - hh, 1, hh);
    if (rim) px(g, rim, x, baseY - hh);
  }
}
// San hô nhánh: mọc đệ quy từ gốc, đầu nhánh sáng hơn.
function coralBranch(g, R, x, y, len, ang, depth, col) {
  let cx = x, cy = y;
  for (let i = 0; i < len; i++) {
    cx += Math.cos(ang); cy -= Math.sin(ang);
    px(g, col[0], Math.round(cx), Math.round(cy));
  }
  if (depth > 0) {
    coralBranch(g, R, cx, cy, Math.max(2, len - 1 - Math.round(R())), ang + 0.45 + R() * 0.3, depth - 1, col);
    coralBranch(g, R, cx, cy, Math.max(2, len - 1 - Math.round(R())), ang - 0.45 - R() * 0.3, depth - 1, col);
  } else {
    px(g, col[1], Math.round(cx), Math.round(cy) - 1);
  }
}

let PB = null;  // bộ đệm các lớp nền (dựng lại khi bounds/bến đổi)
function pixelBg(meta) {
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const dp = meta.dock_pos || [2, 0];
  const key = JSON.stringify([b, dp]);
  if (PB && PB.key === key) return PB;
  const X = b.x[1], D = b.d[1];
  const W = (X + 4) * PX, H = (SKY_M + D + 1) * PX, S = SKY_M * PX;  // S = hàng điểm ảnh của mặt nước
  const mx = (x) => Math.round((x + 2) * PX), my = (d) => Math.round((d + SKY_M) * PX);
  const M = Math.ceil((X / 2) * PX * 0.3) + 4;  // lề cho parallax
  const WW = W + 2 * M;
  const R = rng32(20261121);

  // 1. Trời buổi sáng: xanh trong, mặt trời còn thấp, mây trắng, chim
  const [sky, gs] = mkCanvas(W, S);
  ditherBands(gs, 0, 0, W, S, PAL.sky);
  const sunX = Math.round(W * 0.72), sunY = 9;
  for (let y = -13; y <= 13; y++) for (let x = -13; x <= 13; x++) {
    const r2 = x * x + y * y;
    const fade = 1 - (Math.sqrt(r2) - 7) / 6;   // quầng sáng thưa dần ra ngoài (dither)
    if (r2 > 49 && fade > 0 && BAYER[(y + 16) & 3][(x + 16) & 3] < fade * 9) px(gs, PAL.glow, sunX + x, sunY + y);
  }
  disc(gs, PAL.sunEdge, sunX, sunY, 7); disc(gs, PAL.sun, sunX, sunY, 5);
  for (let i = 0; i < 7; i++) {
    const cx = Math.round(R() * W), cy = 4 + Math.round(R() * S * 0.45), len = 14 + Math.round(R() * 18);
    disc(gs, PAL.cloud, cx + Math.round(len * 0.3), cy, 3);
    disc(gs, PAL.cloudHi, cx + Math.round(len * 0.55), cy - 1, 4);
    disc(gs, PAL.cloud, cx + Math.round(len * 0.8), cy + 1, 2);
    px(gs, PAL.cloud, cx, cy + 1, len, 3);
    px(gs, PAL.cloudLo, cx + 1, cy + 4, len - 2, 1);
  }
  for (let i = 0; i < 4; i++) {
    const bx = Math.round(W * (0.25 + R() * 0.4)), by = 4 + Math.round(R() * 8);
    [[0, 0], [1, -1], [2, 0], [3, -1], [4, 0]].forEach(([dx, dy]) => px(gs, PAL.bird, bx + dx, by + dy));
  }

  // 2. Lớp xa trên bờ: hàng cây và dừa mờ trong sương sớm (parallax chậm)
  const [far, gf] = mkCanvas(WW, S);
  ridge(gf, WW, S, PAL.far, (x) => 5 + 2.5 * Math.sin(x * 0.045) + 1.8 * Math.sin(x * 0.11 + 2) + R() * 1.2);
  for (let x0 = 10; x0 < WW; x0 += 22 + Math.round(R() * 26)) {
    const ht = 14 + Math.round(R() * 8), lean = R() < 0.5 ? -1 : 1;
    let tx = x0, ty = S;
    for (let k = 0; k < ht; k++) { tx = x0 + Math.round(Math.sin((k / ht) * 1.2) * lean * 3); ty = S - 3 - k; px(gf, PAL.farDark, tx, ty); }
    [[-1, 0.2], [1, 0.2], [-0.8, -0.5], [0.8, -0.5], [-0.3, -0.9], [0.4, -0.8]].forEach(([dx, dy]) => {
      for (let j = 1; j <= 6; j++) px(gf, PAL.farDark, tx + Math.round(dx * j), ty + Math.round(dy * j + j * j * 0.09));
    });
  }

  // 3. Lớp giữa trên bờ: nhà sàn gỗ mái lá, dừa nước, ghe người đội nón lá (parallax vừa)
  const [mid, gm] = mkCanvas(WW, S);
  for (let i = 0; i < 4; i++) {
    const x0 = M + Math.round(W * (0.2 + i * 0.21 + R() * 0.05)), hw = 14 + Math.round(R() * 6), hh = 7 + Math.round(R() * 3);
    const fy = S - 4;
    for (let x = x0; x <= x0 + hw; x += 4) px(gm, PAL.stilt, x, fy, 1, 5);
    px(gm, PAL.wallDark, x0 - 1, fy - 1, hw + 3, 1);
    px(gm, PAL.wall, x0, fy - 1 - hh, hw + 1, hh);
    for (let x = x0 + 2; x < x0 + hw; x += 3) px(gm, PAL.wallDark, x, fy - hh, 1, hh - 1);
    for (let r = 0; r < 6; r++) px(gm, r % 2 ? PAL.roofDark : PAL.roof, x0 - 3 + r, fy - 2 - hh - r, hw + 7 - 2 * r, 1);
    px(gm, PAL.window, x0 + 3, fy - hh + 1, 3, 2);
    px(gm, PAL.window, x0 + hw - 4, fy - hh + 2, 2, hh - 3);
  }
  for (let i = 0; i < 10; i++) {
    const bx = Math.round(R() * WW), n = 5 + Math.round(R() * 3);
    for (let f = 0; f < n; f++) {
      const a = Math.PI * (1.15 + (f / (n - 1)) * 0.7), len = 6 + Math.round(R() * 6);
      for (let j = 1; j <= len; j++) {
        const fx = bx + Math.round(Math.cos(a) * j), fy = S + Math.round(Math.sin(a) * j + j * j * 0.05);
        px(gm, j % 3 === 0 ? PAL.nipaHi : PAL.nipa, fx, fy);
      }
    }
  }
  const gx = M + Math.round(W * 0.56);
  px(gm, PAL.boatHi, gx, S - 2, 18, 1); px(gm, PAL.boat, gx + 2, S - 1, 14, 1);
  px(gm, PAL.boat, gx - 1, S - 3); px(gm, PAL.boat, gx + 18, S - 3);
  px(gm, PAL.shirt, gx + 8, S - 6, 2, 4);
  px(gm, PAL.hat, gx + 6, S - 7, 6, 1); px(gm, PAL.hat, gx + 7, S - 8, 4, 1); px(gm, PAL.hat, gx + 8, S - 9, 2, 1);
  for (let k = 0; k < 6; k++) px(gm, PAL.woodDark, gx + 11 + k, S - 6 + k);

  // 4. Nước: dải xanh ngọc -> xanh thẳm
  const [water, gw] = mkCanvas(W, H);
  ditherBands(gw, 0, S, W, H - S, PAL.water);
  const bedBase = my(D);

  // 5. Đá xa và đá gần dưới nước (bóng mờ, parallax) để tạo chiều sâu
  const [uwFar, gu1] = mkCanvas(WW, H);
  ridge(gu1, WW, bedBase + 2, PAL.hazeFar, (x) => 18 + 12 * Math.sin(x * 0.028 + 1) + 7 * Math.sin(x * 0.071) + R() * 1.5);
  for (let i = 0; i < 5; i++) {   // vài trụ đá cao vươn lên
    const cx = Math.round(R() * WW), hw = 6 + Math.round(R() * 6), top = S + 28 + Math.round(R() * 30);
    for (let y = top; y < bedBase; y++) {
      const k = (y - top) / (bedBase - top), half = Math.round(hw * (0.55 + 0.45 * k) + Math.sin(y * 0.3) * 1.2);
      px(gu1, PAL.hazeFar, cx - half, y, half * 2, 1);
    }
  }
  const [uwMid, gu2] = mkCanvas(WW, H);
  ridge(gu2, WW, bedBase + 2, PAL.hazeMid, (x) => 9 + 6 * Math.sin(x * 0.05 + 3) + 4 * Math.sin(x * 0.13) + R() * 1.2, PAL.rimMid);

  // 6. Đáy (gắn tọa độ thế giới): cát, tảng đá phủ rêu, san hô, bọt biển, sao biển, lu sành, bến
  const [bed, gb] = mkCanvas(W, H);
  for (let y = S + 16; y < H; y += 2) {   // tối dần hai mép, đậm dần theo độ sâu (không có mép cứng)
    const ky = Math.min(1, (y - S - 16) / 60);
    for (let x = 0; x < 48; x += 2) {
      const a = (0.34 * ky * (1 - x / 48)).toFixed(3);
      px(gb, PAL.vignette + a + ")", x, y, 2, 2);
      px(gb, PAL.vignette + a + ")", W - 2 - x, y, 2, 2);
    }
  }
  const bedY = [];
  for (let x = 0; x < W; x++) {
    bedY[x] = bedBase - Math.round(1.5 + 1.5 * Math.sin(x * 0.07) + Math.sin(x * 0.19 + 1) + R() * 0.8);
    px(gb, PAL.sandLo, x, bedY[x], 1, H - bedY[x]);
    px(gb, PAL.sand, x, bedY[x], 1, 2);
    px(gb, PAL.sandHi, x, bedY[x]);
    if (R() < 0.25) px(gb, PAL.sand, x, bedY[x] + 2 + Math.round(R() * 3));
  }
  const at = (x) => bedY[Math.max(0, Math.min(W - 1, Math.round(x)))];
  const boulder = (cx, rw, rh) => {   // tảng đá nửa elip, sáng bên trái, rêu trên đỉnh
    const base = at(cx) + 1;
    for (let y = 0; y <= rh; y++) {
      const half = Math.round(rw * Math.sqrt(1 - (y / rh) ** 2)), yy = base - y;
      if (half <= 0) continue;
      px(gb, PAL.rock, cx - half, yy, half * 2 + 1, 1);
      px(gb, PAL.rockHi, cx - half, yy, Math.max(1, Math.round(half * 0.35)), 1);
      px(gb, PAL.rockLo, cx + half - 1, yy, 2, 1);
      if (y >= rh - 2) for (let x = cx - half; x <= cx + half; x++) if (R() < 0.7) px(gb, R() < 0.4 ? PAL.mossHi : PAL.moss, x, yy - 1);
    }
    for (let i = 0; i < rw; i++) if (R() < 0.35) {   // rêu rủ xuống thân đá
      const x = cx - rw + Math.round(R() * rw * 2), len = 1 + Math.round(R() * 3);
      px(gb, PAL.moss, x, base - rh + 1, 1, len);
    }
  };
  for (let i = 0; i < 10; i++) boulder(mx(6) + Math.round(R() * (W - mx(6) - 10)), 5 + Math.round(R() * 7), 4 + Math.round(R() * 5));
  for (let i = 0; i < 26; i++) {
    const cx = mx(6) + Math.round(R() * (W - mx(6) - 6)), base = at(cx), kind = R(), col = PAL.coral[Math.floor(R() * PAL.coral.length)];
    if (kind < 0.45) {                       // san hô nhánh
      coralBranch(gb, R, cx, base, 3 + Math.round(R() * 2), Math.PI / 2 + (R() - 0.5) * 0.4, 2 + Math.round(R()), col);
    } else if (kind < 0.65) {                // bọt biển ống
      for (let k = 0; k < 2 + Math.round(R() * 2); k++) {
        const tx = cx + k * 4, th = 5 + Math.round(R() * 7);
        px(gb, PAL.sponge, tx, base - th, 3, th); px(gb, PAL.spongeIn, tx + 1, base - th, 1, 2);
      }
    } else if (kind < 0.82) {                // san hô tròn (não)
      const r = 3 + Math.round(R() * 2);
      for (let y = 0; y <= r; y++) { const half = Math.round(Math.sqrt(r * r - y * y)); px(gb, col[0], cx - half, base - y, half * 2 + 1, 1); }
      for (let y = 1; y < r; y += 2) for (let x = -r + 1; x < r; x += 2) px(gb, col[1], cx + x + (y % 4 ? 1 : 0), base - y);
    } else {                                 // quạt biển
      for (let f = 0; f < 7; f++) {
        const a = Math.PI * (0.25 + f * 0.083);
        for (let j = 1; j <= 7; j++) px(gb, j > 5 ? col[1] : col[0], cx + Math.round(Math.cos(a) * j), base - Math.round(Math.sin(a) * j));
      }
    }
  }
  for (let i = 0; i < 4; i++) {              // sao biển
    const sx0 = mx(8) + Math.round(R() * (W - mx(8))), sy0 = at(sx0) + 1;
    px(gb, PAL.star, sx0 - 1, sy0, 3, 1); px(gb, PAL.star, sx0, sy0 - 1, 1, 3);
  }
  const jx = mx(X * 0.72), jy = at(jx) - 3;   // lu sành chìm, phủ rêu (dấu tích chợ nổi)
  disc(gb, PAL.jar, jx, jy, 4); px(gb, PAL.jarLo, jx - 2, jy - 5, 5, 1); px(gb, PAL.jarHi, jx - 2, jy - 2, 1, 2);
  px(gb, PAL.moss, jx - 3, jy - 4, 3, 1); px(gb, PAL.mossHi, jx + 1, jy - 4, 2, 1);
  const dx0 = mx(dp[0] - 2.5), dx1 = mx(dp[0] + 2.5);   // bến gỗ + chòi lá của Má Tư
  for (let x = dx0 + 1; x < dx1; x += 5) { px(gb, PAL.woodDark, x, S - 3, 2, my(3.5) - S + 3); px(gb, PAL.moss, x, S + 4, 2, my(3.5) - S - 4); }
  px(gb, PAL.wood, dx0, S - 4, dx1 - dx0, 2);
  for (let x = dx0 + 2; x < dx1; x += 3) px(gb, PAL.woodDark, x, S - 4);
  const hx = mx(dp[0] - 1.6), hw = Math.round(3.2 * PX);
  px(gb, PAL.wall, hx, S - 11, hw, 7);
  px(gb, PAL.woodDark, hx + Math.floor(hw / 2) - 1, S - 9, 3, 5);
  for (let r = 0; r < 5; r++) px(gb, r % 2 ? PAL.thatchDark : PAL.thatch, hx - 3 + r, S - 12 - r, hw + 6 - 2 * r, 1);
  px(gb, PAL.lamp, hx + hw + 1, S - 10, 2, 2);

  // 7. Danh sách hoạt ảnh: rong/tảo bẹ, phù du, tia nắng, bọt, đàn cá xa
  const kelps = [], specks = [], rays = [], bubbles = [], schools = [];
  for (let i = 0; i < 30; i++) {
    const x = mx(5) + Math.round(R() * (W - mx(5) - 4)), tall = R() < 0.35;
    kelps.push({ x, y: bedY[x], h: tall ? 16 + Math.round(R() * 14) : 4 + Math.round(R() * 7), ph: R() * 6.28, c: PAL.kelp[i % 2] });
  }
  for (let i = 0; i < 90; i++) specks.push({ x: R() * W, y: S + 4 + R() * (bedBase - S - 10), v: (R() - 0.5) * 3, ph: R() * 6.28 });
  for (let i = 0; i < 10; i++) rays.push({ slope: -1.1 + i * 0.19 + (R() - 0.5) * 0.08, w: 3 + Math.round(R() * 4), len: 60 + Math.round(R() * 60), ph: R() * 6.28 });
  for (let i = 0; i < 7; i++) {
    const kx = mx(8) + Math.round(R() * (W - mx(8) - 4));
    for (let j = 0; j < 4; j++) bubbles.push({ x: kx + Math.round((R() - 0.5) * 3), y0: bedY[kx] - 2, v: 7 + R() * 7, ph: R() * 300, big: R() < 0.3 });
  }
  for (let i = 0; i < 3; i++) {
    const fish = [];
    for (let j = 0; j < 9; j++) fish.push([Math.round((R() - 0.5) * 22), Math.round((R() - 0.5) * 8)]);
    schools.push({ x0: R() * WW, y: S + 22 + Math.round(R() * (bedBase - S - 60)), v: (R() < 0.5 ? -1 : 1) * (3 + R() * 3), fish });
  }

  const [frame, g] = mkCanvas(W, H);
  PB = { key, W, H, S, M, WW, sunX, sky, far, mid, water, uwFar, uwMid, bed, frame, g, kelps, specks, rays, bubbles, schools };
  return PB;
}

// Ghép các lớp + hoạt ảnh lên canvas nhỏ. camX (mét) lệch theo người chơi để tạo parallax.
function renderPixelBg(meta, camX, t) {
  const P = pixelBg(meta), g = P.g, W = P.W, S = P.S;
  const off = (k) => -P.M - Math.max(-P.M, Math.min(P.M, Math.round(camX * PX * k)));
  g.clearRect(0, 0, W, P.H);
  g.drawImage(P.sky, 0, 0);
  g.drawImage(P.far, off(0.12), 0);
  g.drawImage(P.mid, off(0.25), 0);
  g.drawImage(P.water, 0, 0);
  g.drawImage(P.uwFar, off(0.08), 0);
  for (const sc of P.schools) {  // đàn cá nhỏ bơi xa (chỉ trang trí, không bắt được)
    const span = P.WW + 60, cx = ((sc.x0 + t * sc.v) % span + span) % span - 30 + off(0.08);
    const dir = sc.v > 0 ? 1 : -1;
    for (const [fx, fy] of sc.fish) {
      const x = Math.round(cx + fx), y = Math.round(sc.y + fy + Math.sin(t * 1.3 + fx) * 1.2);
      px(g, PAL.school, x, y, 3, 1); px(g, PAL.school, x - dir, y - 1); px(g, PAL.school, x - dir, y + 1);
    }
  }
  g.drawImage(P.uwMid, off(0.16), 0);
  for (const r of P.rays) {  // tia nắng xòe ra từ phía mặt trời
    const a0 = 0.075 + 0.04 * Math.sin(t * 0.9 + r.ph), sway = Math.sin(t * 0.2 + r.ph) * 0.03;
    for (let k = 0; k < r.len; k++) {
      g.fillStyle = `rgba(${PAL.ray},${(a0 * (1 - k / r.len)).toFixed(3)})`;
      g.fillRect(Math.round(P.sunX + (k + 18) * (r.slope + sway)), S + 1 + k, Math.round(r.w + k * 0.05), 1);
    }
  }
  g.drawImage(P.bed, 0, 0);
  for (const kp of P.kelps) {  // rong / tảo bẹ đung đưa
    for (let k = 0; k < kp.h; k++) {
      const o = Math.round(Math.sin(t * 1.4 + kp.ph + k * 0.35) * (k / kp.h) * (kp.h > 12 ? 3 : 1.5));
      px(g, kp.c[k % 4 < 2 ? 0 : 1], kp.x + o, kp.y - k);
      if (k % 3 === 1) px(g, kp.c[1], kp.x + o + (k % 2 ? 1 : -1), kp.y - k);
    }
  }
  for (const sp of P.specks) {  // phù du lơ lửng
    const x = ((sp.x + t * sp.v) % W + W) % W;
    px(g, PAL.speck, Math.round(x), Math.round(sp.y + Math.sin(t * 0.7 + sp.ph) * 2));
  }
  for (const bb of P.bubbles) {  // chuỗi bọt nổi lên
    const span = bb.y0 - S - 2, y = Math.round(bb.y0 - ((t * bb.v + bb.ph) % span)), x = Math.round(bb.x + Math.sin(t * 3 + bb.ph) * 1.2);
    if (bb.big) { px(g, PAL.bubble, x, y - 1, 2, 1); px(g, PAL.bubble, x - 1, y, 1, 1); px(g, PAL.bubble, x + 2, y, 1, 1); px(g, PAL.bubble, x, y + 1, 2, 1); }
    else px(g, PAL.bubble, x, y);
  }
  for (let y = 2; y <= 12; y += 2) {  // vân sáng (caustics) ngay dưới mặt nước
    for (let x = 0; x < W; x++) {
      const v = Math.sin(x * 0.23 + t * 1.6 + y * 0.7) + Math.sin(x * 0.09 - t * 1.1 + y);
      if (v > 1.25 + y * 0.03) px(g, PAL.caustic, x, S + y);
    }
  }
  for (let x = 0; x < W; x++) {  // mặt nước gợn sóng
    const wv = Math.sin(x * 0.32 + t * 2.4) + Math.sin(x * 0.11 - t * 1.3) + 0.6 * Math.sin(x * 0.047 + t * 0.7);
    px(g, PAL.surfLo, x, S + 1);
    px(g, PAL.surfHi, x, S - (wv > 1.3 ? 1 : 0));
  }
  for (let i = 0; i < 24; i++) {  // lấp lánh dưới mặt nước (vị trí băm giả ngẫu nhiên, đổi theo nhịp)
    const step = Math.floor(t * 3 + i * 0.37);
    const hsh = Math.imul(i * 7919 + step * 104729, 2654435761) >>> 0;
    if ((step + i) % 3 === 0) px(g, PAL.surfHi, hsh % W, S + 2 + (hsh >>> 8) % 4, 2, 1);
  }
  return P;
}

function panOfX(x) {

  const mid = (b[0] + b[1]) / 2, half = Math.max(1, (b[1] - b[0]) / 2);

function handleQuanAudio(s) {
  const QA = window.QuanAudio;
  if (!QA || !s) return;
  if (s.mode !== "quan") {
    if (audioRun.prevMode === "quan") QA.setScene("off");
    audioRun.prevMode = s.mode;
    audioRun.prevTick = s.tick ?? -1;
    audioRun.prevSigs = [];
    audioRun.prevFinished = false;
    audioRun.custMoods = {};
    return;
  }
  const tick = s.tick ?? 0;
  const reset = audioRun.prevMode !== "quan" || tick < audioRun.prevTick;
  if (reset) {
    audioRun.prevSigs = [];
    audioRun.custMoods = {};
    audioRun.prevFinished = false;
  }
  const currEvents = s.events || [];
  const currSigs = currEvents.map((e) => JSON.stringify([e.tick, e.name, e.data || null]));
  let newEvents = [];
  if (reset && tick > 5) {
    newEvents = [];
  } else {
    const prev = audioRun.prevSigs;
    let overlap = 0;
    const maxK = Math.min(prev.length, currSigs.length);
    for (let k = maxK; k >= 1; k--) {
      let ok = true;
      for (let i = 0; i < k; i++) {
        if (prev[prev.length - k + i] !== currSigs[i]) { ok = false; break; }
      }
      if (ok) { overlap = k; break; }
    }
    newEvents = currEvents.slice(overlap);
  }
  audioRun.prevSigs = currSigs;
  audioRun.prevTick = tick;
  audioRun.prevMode = "quan";

  newEvents.forEach((ev) => {
    const d = ev.data || {};
    switch (ev.name) {
      case "customer_arrived":
        QA.playSfx("customer_arrive", { pan: panOfTable(d.table_id) });
        break;
      case "cook_started": {
        const st = (s.stoves || []).find((x) => x.id === d.stove_id);
        const isFridge = (st && st.serves === "coca") || d.dish_id === "coca";
        QA.playSfx(isFridge ? "fridge_open" : "cook_start", { pan: panOfStove(d.stove_id) });
        break;
      }
      case "dish_ready":
        QA.playSfx("dish_ready", { pan: panOfStove(d.stove_id) });
        break;
      case "dish_picked":
        QA.playSfx("dish_pickup", { pan: panOfStove(d.stove_id), jitter: 0.05 });
        break;
      case "served":
        QA.playSfx("serve", { pan: panOfTable(d.table_id) });
        break;
      case "paid":
        QA.playSfx(d.tip > 0 ? "coin_tip" : "coin_pay", { pan: panOfCustomer(d.customer_id), jitter: 0.04 });
        break;
      case "customer_left":
        QA.playSfx("customer_leave", { pan: panOfCustomer(d.customer_id) });
        break;
      case "dish_wasted":
        QA.playSfx("dish_waste", { pan: d.stove_id ? panOfStove(d.stove_id) : 0 });
        break;
      case "bought":
        QA.playSfx("buy", { pan: 0.55, jitter: 0.05 });
        break;
      case "upgraded":
        QA.playSfx("upgrade", { pan: 0 });
        break;
      case "buy_failed":
      case "upgrade_failed":
        QA.playSfx("error", { pan: 0 });
        break;
    }
  });

  const nextMoods = {};
  let angryCount = 0;
  const pDefault = ((s.meta || {}).patience_s || 60) * 60;
  (s.customers || []).forEach((c) => {
    const ratio = Math.max(0, Math.min(1, c.patience_ticks_left / (c.patience_max || pDefault)));
    const m = moodOf(c, ratio);
    nextMoods[c.id] = m;
    if (c.state === "waiting" && m === "gian") {
      angryCount++;
      if (audioRun.custMoods[c.id] && audioRun.custMoods[c.id] !== "gian") {
        QA.playSfx("customer_angry", { pan: panOfTable(c.table_id) });
      }
    }
  });
  audioRun.custMoods = nextMoods;

  if (s.finished) {
    QA.setScene("ended");
    if (!audioRun.prevFinished) QA.playSfx("jingle_end", { gain: 0.88 });
    audioRun.prevFinished = true;
  } else {
    audioRun.prevFinished = false;
    const secLeft = (s.time_left_ticks || 0) / 60;
    QA.setScene((secLeft > 0 && secLeft <= 25) || angryCount >= 2 ? "rush" : "night");
  }
}

document.getElementById("btnNext").onclick = () => postRestart({ next: true });
document.getElementById("btnRetry").onclick = () => postRestart({});
document.getElementById("btnNew").onclick = () => postRestart({ new: true });

// ---------- điều khiển âm thanh ----------
(function setupAudioUi() {
  const QA = window.QuanAudio;
  const btnAudio = document.getElementById("btnAudio");
  const btnCfg = document.getElementById("btnAudioCfg");
  const panel = document.getElementById("audioPanel");
  const volBgm = document.getElementById("volBgm");
  const volAmb = document.getElementById("volAmb");
  const volSfx = document.getElementById("volSfx");
  if (!QA) { btnAudio.style.display = btnCfg.style.display = "none"; return; }
  function renderAudioUi(st) {
    btnAudio.textContent = st.muted ? "🔇 Nhạc: Tắt" : (st.unlocked ? "🔊 Nhạc: Bật" : "🔊 Bật nhạc");
    volBgm.value = Math.round(st.bgmVol * 100);
    volAmb.value = Math.round(st.ambVol * 100);
    volSfx.value = Math.round(st.sfxVol * 100);
  }
  QA.onStateChange(renderAudioUi);
  renderAudioUi(QA.getState());
  btnAudio.onclick = () => {
    const muted = QA.toggleMute();
    if (!muted) playUiClick();
  };
  btnCfg.onclick = () => {
    QA.unlock();
    playUiClick();
    panel.style.display = panel.style.display === "block" ? "none" : "block";
  };
  document.getElementById("btnAudioClose").onclick = () => { playUiClick(); panel.style.display = "none"; };
  document.getElementById("btnAudioTest").onclick = () => { QA.unlock(); QA.playSfx("dish_ready"); };
  volBgm.oninput = () => QA.setVolume("bgm", volBgm.value / 100);
  volAmb.oninput = () => QA.setVolume("ambience", volAmb.value / 100);
  volSfx.oninput = () => QA.setVolume("sfx", volSfx.value / 100);
})();
let rulesShownOnce = false;
function updateMenu() {
  if (!snap) return;
  const multi = snap.day !== undefined;
  const bn = document.getElementById("btnNext"), bw = document.getElementById("btnNew");
  const bu = document.getElementById("btnUpg"), br = document.getElementById("btnRetry");
  const mb = document.getElementById("menubar");
  bn.style.display = bw.style.display = multi ? "" : "none";
  bn.disabled = !(snap.finished && snap.reason === "time");
  bu.style.display = snap.upgrades ? "" : "none";

  const isGather = snap.mode !== "quan";
  const showBar = isGather;                      // Quán: HUD + nút nằm trong canvas, không dùng thanh DOM
  br.style.display = isGather ? "" : "none";
  mb.style.display = showBar ? "flex" : "none";
  cv.style.marginTop = showBar ? "44px" : "0px";
  cv.style.height = showBar ? "calc(100vh - 44px)" : "100vh";

  if (isGather) {
    const hpMax = (snap.player && snap.player.hp_max) ? snap.player.hp_max : 3;
    br.style.position = "fixed";
    br.style.left = (355 + hpMax * 26 + 8) + "px";
    br.style.right = "";
    br.style.top = (showBar ? 50 : 6) + "px";
    br.style.zIndex = "11";
  } else {
    br.style.position = "fixed";
    br.style.left = "";
    br.style.right = "12px";
    br.style.top = "6px";
    br.style.zIndex = "11";
  }
}

function lowXY(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / SC, (e.clientY - r.top) / SC]; }
function btnAt(e) {
  if (!snap || snap.mode !== "quan") return null;
  const [x, y] = lowXY(e);
  return BTNS.find((b) => b.enabled && x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) || null;
}
cv.addEventListener("mousemove", (e) => { const [x, y] = lowXY(e); MOUSE.x = x; MOUSE.y = y; if (btnAt(e)) cv.style.cursor = "pointer"; });
cv.addEventListener("mouseleave", () => { MOUSE.x = MOUSE.y = -99; MOUSE.down = false; });
cv.addEventListener("mousedown", () => { MOUSE.down = true; });
addEventListener("mouseup", () => { MOUSE.down = false; });
cv.addEventListener("click", (e) => {
  const b = btnAt(e);
  if (!b) return;
  if (b.id === "audio") { if (window.QuanAudio && !window.QuanAudio.toggleMute()) playUiClick(); }
  else if (b.id === "rules") { playUiClick(); showRules(rulesEl.style.display !== "block"); }
  else if (b.id === "upg") { playUiClick(); toggleUpg(); }
  else if (b.id === "next") postRestart({ next: true });
  else if (b.id === "retry") postRestart({});
  else if (b.id === "new") postRestart({ new: true });
});
cv.addEventListener("contextmenu", (e) => {
  const b = btnAt(e);
  if (b && b.id === "audio") {
    e.preventDefault();
    if (window.QuanAudio) window.QuanAudio.unlock();
    playUiClick();
    const p = document.getElementById("audioPanel");
    p.style.display = p.style.display === "block" ? "none" : "block";
  }
});

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const q = !!(snap && snap.mode === "quan");
  document.getElementById("menubar").style.display = q ? "none" : "flex";
  cv.style.marginTop = q ? "0" : "44px"; cv.style.height = q ? "100vh" : "calc(100vh - 44px)";
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    if (snap.mode !== "quan") eventLog(w, h);
    overlay(w, h);
    updateMenu();
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
